# Set of rules to map to
# So miyuki, set them like this: <member>=<local subnet>
# All services should be on the same port: 3000.
# example: galatea=3
# the proxy will expand it to 10.0.1.3

# The key below is used to halt all execution and instead display an error message
$Proxy.MaintenanceMode=false

git=5
galatea=3,no-cors-check
auth=2
# stellar is for the stellarOS subproject.
stellar=6
ashen=4
<root>=7

# these are old projects, or projects that were moved.
# and yes! they're ports, we used to forward by ports instead of by natted IP addresses.
#nereinder=1500
#midnightlib=1520