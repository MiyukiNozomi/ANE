<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="darkreader-lock" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Galatea Storage</title>

    <meta name="title" content="Galatea Storage" />
    <meta name="theme-color" content="#d7514d" />
    <meta
      name="description"
      content="A place where mostly immutable content is stored in ANE."
    />
    <meta
      property="og:image"
      content="https://galatea.ane.jp.net/dl/images/logos/ane-logo-final.webp"
    />

    <style>
      @font-face {
        font-family: Kumbh;
        src: url(/dl/fonts/kumbh_sans.ttf);
      }

      @font-face {
        font-family: MPLUS2;
        src: url(/dl/fonts/MPLUS2.ttf);
      }

      header {
        background-color: #d7514d;
        border-top: 4px solid #a43f3b;
        border-bottom: 4px solid #a43f3b;
        color: white;
        font-weight: bold;

        display: flex;
        align-items: center;
        gap: 1em;
        font-size: 0.8em;
      }

      header h1,
      header p {
        margin: 0;
        padding: 0;
      }

      header .logo {
        display: flex;
        align-items: center;
        background-color: white;
      }

      p.content {
        font-family: MPLUS2;
        font-size: 1.5em;
        color: #ffffff;
        padding: 2em;
      }

      a {
        color: #00aeff;
      }

      .btn {
        border-radius: 0.5em;
        border: 2px solid #ff2200;
        background-color: #010101;
        padding: 0.5em 1em;
        color: white;
        text-decoration: none;
      }

      .btn:hover {
        background-color: #a43f3b;
      }

      body,
      html {
        font-family: Kumbh;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: linear-gradient(45deg, #04030c, #aa033b);
      }

      .footer {
        margin-top: auto;

        display: flex;
        flex-direction: row;
        align-items: center;

        padding: 4em 2em;
        border-top: 4px solid #a43f3b;
        background: linear-gradient(180deg, #010101, #2e0404, #010101);
      }

      @media screen and (orientation: portrait) {
        .footer {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo">
        <img
          src="/favicon.ico"
          style="padding: 0.5rem; width: 4em; height: 4em"
          alt=""
        />
      </div>
      <div class="">
        <h1>Galatea Storage</h1>
        <p>The storage area of ANE.</p>
      </div>
    </header>
    <p class="content">
      A special place where all public files in my system are kept. send me an
      email at
      <a href="email:miyuki@ane.jp.net">miyuki@ane.jp.net</a> if you were
      looking for something I've might have removed.
    </p>
    <p class="content">
      <a href="/dl/" class="btn">See file list</a>
    </p>
    <div class="footer">
      <a href="https://ane.jp.net"
        ><img
          src="/dl/images/logos/ane-logo-final.webp"
          alt="ANE logo"
          style="height: 4.5em"
      /></a>
    </div>
  </body>
</html>
